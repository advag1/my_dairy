<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>יומן שבועי - פתקים נדבקים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- מסך כניסה / בחירת משתמש -->
  <div id="authModal" class="modal-backdrop">
    <div class="modal-card auth-card">
      <div class="modal-header">
        <h2>👋 כניסה ליומן השבועי</h2>
      </div>
      <p class="auth-desc">הזיני שם משתמש (ייווצר לך ID אישי אוטומטית) או התחברי באמצעות ה-ID הקיים שלך:</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="loginUsername">שם משתמש</label>
          <input type="text" id="loginUsername" placeholder="לדוגמה: נועה" />
        </div>

        <div class="divider-or"><span>או</span></div>

        <div class="form-group">
          <label for="loginUserId">מזהה משתמש (ID)</label>
          <input type="text" id="loginUserId" placeholder="לדוגמה: USR-1234" dir="ltr" />
        </div>

        <p id="loginError" class="error-text hidden"></p>

        <button type="submit" class="btn-primary full-width">כניסה ליומן</button>
      </form>
    </div>
  </div>

  <div class="app-container">
    <!-- סרגל עליון -->
    <header class="topbar">
      <div class="topbar-right">
        <h1>📅 יומן שבועי</h1>
        <span id="weekRange" class="week-badge"></span>
        <div id="userBadge" class="user-badge hidden">
          <span>👤 <strong id="displayUsername"></strong></span>
          <span class="user-id-tag" id="displayUserId" title="ה-ID האישי שלך לשמירה"></span>
          <button type="button" id="logoutBtn" class="logout-btn" title="החלף משתמש">החלף משתמש</button>
        </div>
      </div>

      <div class="topbar-controls">
        <input type="text" id="searchInput" class="control-input" placeholder="🔍 חיפוש משימה / מועד..." />
        <select id="categoryFilter" class="control-select">
          <option value="all">כל הקטגוריות</option>
          <option value="מבחן">🎯 מועדים ומבחנים</option>
          <option value="בית">בית</option>
          <option value="לימודים">לימודים</option>
          <option value="עבודה">עבודה</option>
          <option value="אישי">אישי</option>
        </select>
        <button type="button" id="openNewNoteBtn" class="btn-primary">+ הוסף פתק / מועד</button>
      </div>
    </header>

    <!-- לוח שבועי - 7 עמודות -->
    <main class="board" id="weeklyBoard"></main>

    <!-- אזור תחתון: משימות שטרם שובצו -->
    <section class="backlog-section">
      <div class="backlog-header">
        <div class="backlog-title">
          <span>📥 מחסן משימות (עוד לא החלטתי מתי לעשות)</span>
          <span class="backlog-hint">גררי משימה מכאן אל אחד הימים בלוח, או לחצי לעריכה</span>
        </div>
        <button type="button" id="addBacklogBtn" class="btn-secondary-sm">+ משימה למחסן</button>
      </div>
      <div class="notes-dropzone backlog-dropzone" id="backlogZone" data-day="-1" data-period="unscheduled"></div>
    </section>
  </div>

  <!-- חלונית (Modal) ליצירה ועריכה של פתק או מועד -->
  <div id="noteModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">פתק משימה חדש</h2>
        <button type="button" id="closeModalBtn" class="icon-btn" aria-label="סגור">✕</button>
      </div>

      <form id="noteForm">
        <input type="hidden" id="noteId" />

        <!-- בחירת סוג: פתק משימה או מועד/מבחן -->
        <div class="form-group">
          <label>סוג הפריט</label>
          <div class="type-selector">
            <label class="type-option">
              <input type="radio" name="noteType" value="task" checked />
              <span>📝 פתק משימה</span>
            </label>
            <label class="type-option event-opt">
              <input type="radio" name="noteType" value="event" />
              <span>🎯 מועד חשוב / מבחן</span>
            </label>
          </div>
        </div>

        <div class="form-row two-cols">
          <div class="form-group">
            <label for="noteDay">מתי לבצע?</label>
            <select id="noteDay" required>
              <option value="-1">📥 עוד לא הוחלט (מחסן משימות)</option>
              <option value="0">יום ראשון</option>
              <option value="1">יום שני</option>
              <option value="2">יום שלישי</option>
              <option value="3">יום רביעי</option>
              <option value="4">יום חמישי</option>
              <option value="5">יום שישי</option>
              <option value="6">יום שבת</option>
            </select>
          </div>

          <div class="form-group" id="periodGroup">
            <label for="notePeriod">זמן ביום</label>
            <select id="notePeriod">
              <option value="morning">☀️ בוקר</option>
              <option value="evening">🌙 ערב</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="noteCategory">למה זה קשור? (קורס, נושא, קטגוריה)</label>
          <input type="text" id="noteCategory" placeholder="לדוגמה: מבחן במתמטיקה, אודיסאה, בית..." list="categorySuggestions" />
          <datalist id="categorySuggestions">
            <option value="מבחן"></option>
            <option value="הגשת עבודה"></option>
            <option value="שיעורי בית"></option>
            <option value="משימת בית"></option>
            <option value="סידורים"></option>
          </datalist>
        </div>

        <div class="form-group">
          <label for="noteText">תיאור המשימה / פרטי המועד</label>
          <textarea id="noteText" rows="3" placeholder="מה צריך לעשות או לזכור?" required></textarea>
        </div>

        <div class="form-group" id="colorGroup">
          <label>צבע הפתק</label>
          <div class="color-picker" id="colorPicker">
            <button type="button" class="color-swatch selected" data-color="yellow" style="background:#fef08a;" title="צהוב"></button>
            <button type="button" class="color-swatch" data-color="pink" style="background:#fbcfe8;" title="ורוד"></button>
            <button type="button" class="color-swatch" data-color="blue" style="background:#bae6fd;" title="תכלת"></button>
            <button type="button" class="color-swatch" data-color="green" style="background:#bbf7d0;" title="ירוק"></button>
            <button type="button" class="color-swatch" data-color="purple" style="background:#e9d5ff;" title="סגול"></button>
            <button type="button" class="color-swatch" data-color="orange" style="background:#fed7aa;" title="כתום"></button>
          </div>
        </div>

        <div class="form-row two-cols">
          <div class="form-group">
            <label for="noteDueDate">תאריך המבחן / יעד</label>
            <input type="date" id="noteDueDate" />
          </div>

          <div class="form-group">
            <label for="noteEstimate">שעה / זמן משוער</label>
            <input type="text" id="noteEstimate" placeholder="לדוגמה: 09:00 / שעתיים" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="deleteNoteBtn" class="btn-danger hidden">מחק</button>
          <div class="modal-actions-left">
            <button type="button" id="cancelModalBtn" class="btn-secondary">ביטול</button>
            <button type="submit" class="btn-primary">שמור</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
